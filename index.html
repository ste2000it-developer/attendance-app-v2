<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Attendance App V2 — ระบบบันทึกเวลาทำงานที่ใช้งานง่ายสำหรับทุกวัย" />
    <meta name="apple-mobile-web-app-title" content="Attendance" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&amp;family=Oxanium:wght@800&amp;display=swap" rel="stylesheet" />
    <title>Attendance — ระบบบันทึกเวลาทำงาน</title>
    <style>
      #startup-splash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;background:#fff;color:#172d3a;font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;isolation:isolate}
      .startup-brand{position:relative;z-index:1;display:grid;justify-items:center;gap:16px;transform:translateY(-3vh)}
      .startup-brand svg{width:clamp(140px,48vw,190px);height:auto;display:block}
      .startup-brand strong{font-size:clamp(29px,8vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1.2}

      .startup-dots{position:absolute;bottom:max(11%,calc(env(safe-area-inset-bottom,0px) + 24px));display:flex;gap:8px}
      .startup-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#D5EAE3;animation:startup-dot 1.05s ease-in-out infinite}
      .startup-dots i:nth-child(2){animation-delay:.15s}.startup-dots i:nth-child(3){animation-delay:.3s}
      @keyframes startup-dot{0%,70%,100%{background:#D5EAE3}35%{background:#078A78}}
      @media(prefers-reduced-motion:reduce){.startup-dots i{animation:none}.startup-dots i:nth-child(2){background:#078A78}}
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="กำลังเปิด Attendance">
      <div class="startup-brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -1 214 161"><path d="M 18 158 C 3 158 -5 148 4 133 L 68 23 C 77 8 89 0 105 0 C 122 0 134 8 143 23 L 207 133 C 216 148 208 158 193 158 L 187 158 C 177 158 171 153 165 143 L 119 61 C 115 54 111 50 105 50 C 99 50 95 54 91 61 L 45 143 C 39 153 33 158 23 158 Z" fill="#078A78"/><path d="M 80 97 L 86 103 M 105 82 L 105 95 M 130 97 L 124 103" stroke="#086259" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 83 133 L 99 149 L 133 118" stroke="#10CBA7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><strong>Attendance</strong></div>
      <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <noscript>กรุณาเปิด JavaScript เพื่อใช้งาน Attendance</noscript>
    <script>
      requestAnimationFrame(function () {
        var splash = document.getElementById('startup-splash');
        if (splash) splash.dataset.firstFrame = String(performance.now());
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
